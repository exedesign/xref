[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xref*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.png", "*.svg", "*.ico", "*.icns"]

[project]
name = "XRef"
version = "0.3.4-dev"
description = "A simple reference image and video viewer"
readme = "README.rst"
license = {file = "LICENSE"}
authors = [
    { name = "Rebecca Breu", email = "rebecca@rbreu.de" },
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "exif>=1.3.5,<=1.6.0",
    "lxml==5.1.0",
    # QtMultimedia (QMediaPlayer/QVideoSink) is part of PyQt6-Qt6 and is
    # used for video playback
    "pyQt6-Qt6>=6.7.0,<=6.7.0",
    "pyQt6>=6.7.0,<=6.7.0",
    "rectangle-packer>=2.0.1,<=2.0.2",
    # Optional at runtime: web sharing (Collaborate -> Create Web Link)
    "aiohttp>=3.9",
]

[project.gui-scripts]
xref = "xref.__main__:main"

[project.urls]
Homepage = "https://github.com/exedesign/xref/"
Repository = "https://github.com/exedesign/xref"
# Documentation =
Issues = "https://github.com/exedesign/xref/issues"
Changelog = "https://github.com/exedesign/xref/blob/main/CHANGELOG.rst"