name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/build.txt
          pip install .
      - name: Run PyInstaller
        run: pyinstaller XRef.spec
      - name: Rename to the tagged version
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\XRef-*.exe | Select-Object -First 1
          $name = "XRef-${{ github.ref_name }}-windows-x86_64.exe"
          Copy-Item $exe.FullName "dist\$name"
          Remove-Item $exe.FullName
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          retention-days: 5

  github-release:
    name: Create GitHub release
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist
      - name: Create release with the exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          body: |
            XRef ${{ github.ref_name }}

            New in 0.4.0: live WebRTC web mirror with named guests,
            guest ownership of uploaded media/text/strokes, upload
            progress placeholders, proportional title/link scaling and
            smoother drawing. See CHANGELOG.rst for details.

            **Windows**: download the ``.exe`` below and run it - no
            installation needed.
